name: Dist Release

# Builds COMPILED obscura binaries (render+stealth) and publishes them to THIS
# repo's own Releases. The old cross-repo push to gastonmorixe/obscura-dist is
# retired: no DIST_REPO_TOKEN, publishing uses the workflow's GITHUB_TOKEN.
#
# Assets are named with a BUILD EPOCH (obscura-<target>-<epoch>.tar.gz) so a
# newer build sorts above an older one by filename alone, letting the plugin
# compare versions WITHOUT executing the binary.
#
# Trigger: every push to gm/private, plus manual dispatch. Two tags per build:
#   - build-<epoch> : immutable, pin-able
#   - latest        : rolling pointer. Its assets are REPLACED each run (new
#                     files uploaded first, stale ones pruned after) so it only
#                     ever holds the current build.
# A concurrency group cancels a superseded in-flight run, so `latest` cannot be
# overwritten by an older build that happens to finish last.

on:
  push:
    branches: [gm/private]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dist-release
  cancel-in-progress: true

jobs:
  epoch:
    runs-on: ubuntu-latest
    outputs:
      epoch: ${{ steps.e.outputs.epoch }}
    steps:
      - id: e
        # One epoch for the whole matrix so every per-target asset shares the
        # same version token in its filename.
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

  build:
    needs: epoch
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            name: obscura-aarch64-macos
          # Intel macOS runner. macos-latest is now arm64; cross-compiling
          # boring-sys2 to x86_64 there makes clang pick the host arm64 SDK
          # headers wrong ("unknown type name 'uint32_t'"), failing the build.
          # Build natively on the Intel image instead. NOTE: macos-13 was
          # retired (Dec 2025); the current Intel label is `macos-15-intel`.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            name: obscura-x86_64-macos
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            name: obscura-aarch64-linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: obscura-x86_64-linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install stealth build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev pkg-config

      - name: Configure libclang (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          XCODE_PATH="$(xcode-select -p)"
          SDK_PATH="$(xcrun --show-sdk-path)"
          echo "SDKROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-isystem $SDK_PATH/usr/include/c++/v1" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$XCODE_PATH/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      # Build WITH render+stealth. The ma-fetch backend always passes --stealth,
      # and private consumers also need screenshots/PDF/AX paint. Hard build:
      # failure fails the job rather than shipping a thinner binary.
      - name: Build (render,stealth)
        run: cargo build --release --locked --target ${{ matrix.target }} --features render,stealth

      - name: Package
        id: pkg
        run: |
          EPOCH="${{ needs.epoch.outputs.epoch }}"
          ASSET="${{ matrix.name }}-${EPOCH}.tar.gz"
          cd target/${{ matrix.target }}/release
          tar czf "../../../${ASSET}" obscura obscura-worker
          cd ../../..
          SHA=$(shasum -a 256 "${ASSET}" | awk '{print $1}')
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          # Sidecar checksum file so the plugin author (and CI) can read the
          # digest to hardcode into setup.ts without re-downloading.
          echo "${SHA}  ${ASSET}" > "${ASSET}.sha256"

      - name: Upload build artifact (for the publish job)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
          retention-days: 7

  publish:
    needs: [epoch, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EPOCH: ${{ needs.epoch.outputs.epoch }}
    steps:
      - name: Collect built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: List assets + assemble manifest
        run: |
          ls -la dist
          # A small machine-readable manifest the plugin can fetch to learn the
          # current epoch + per-asset sha256 in one shot.
          {
            echo "{"
            echo "  \"epoch\": \"${EPOCH}\","
            echo "  \"commit\": \"${GITHUB_SHA}\","
            echo "  \"assets\": {"
            first=1
            for f in dist/*.sha256; do
              asset=$(basename "$f" .sha256)
              sha=$(awk '{print $1}' "$f")
              if [ $first -eq 0 ]; then echo "    ,"; fi
              echo "    \"${asset}\": \"${sha}\""
              first=0
            done
            echo "  }"
            echo "}"
          } > "dist/manifest-${EPOCH}.json"
          cat "dist/manifest-${EPOCH}.json"

      - name: Publish immutable build-<epoch> release
        run: |
          gh release create "build-${EPOCH}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "obscura build ${EPOCH}" \
            --notes "Compiled obscura binaries (render+stealth). Epoch ${EPOCH}. Commit ${GITHUB_SHA}." \
            --latest=false

      - name: Update rolling 'latest' release
        run: |
          notes="Rolling latest obscura binaries (render+stealth). Epoch ${EPOCH}. Commit ${GITHUB_SHA}."
          if gh release view latest >/dev/null 2>&1; then
            # Move the tag to this commit, upload the new files, then prune
            # everything that is not part of this build.
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/latest" -f sha="${GITHUB_SHA}" -F force=true
            gh release upload latest dist/* --clobber
            keep=$(cd dist && ls -1)
            gh release view latest --json assets -q '.assets[].name' | while read -r name; do
              if ! grep -qxF "$name" <<<"$keep"; then
                echo "prune $name"
                gh release delete-asset latest "$name" -y
              fi
            done
            gh release edit latest --title "obscura latest" --notes "$notes" --latest
          else
            gh release create latest dist/* \
              --target "${GITHUB_SHA}" \
              --title "obscura latest" \
              --notes "$notes" \
              --latest
          fi
