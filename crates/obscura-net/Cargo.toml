[package]
name = "obscura-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
stealth = ["wreq", "wreq-util", "futures-util"]

[dependencies]
obscura-ssrf = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
encoding_rs = "0.8"
tempfile = "3"
psl = "2"
futures-util = { version = "0.3", optional = true }
# wreq / wreq-util were reset from the 6.0.0-rc / 3.0.0-rc line onto 0.16 / 0.2
# (upstream release-plz baseline reset). Pin exact versions so a caret cannot
# pull an incompatible build and break `cargo build --features stealth`
# (issue #234).
#
# crates.io wreq-util 0.2.0 only ships Profile::Chrome149. Chrome150-154 live
# on upstream main (PR #107/#112/#120) and are not published yet, so pin a
# git rev that exposes Chrome154. Workspace [patch.crates-io] redirects wreq
# 0.16.1 to upstream git (trust_anchors / grease_sigalgs_enabled for Chrome152+).
#
# `emulation-compression` makes wreq-util's Chrome emulation emit the
# `accept-encoding` request header in its native position (right after
# `accept`, before `accept-language`), matching live Chrome. Without it the
# emulation omits accept-encoding entirely — a glaring bot signal, since every
# real browser advertises it. DataDome (WSJ via geo.captcha-delivery.com)
# scores its absence and serves the CAPTCHA interstitial. Must be paired with
# wreq's decode features below so the advertised encodings are actually
# decompressed (see issue: WSJ/DataDome block).
wreq-util = { git = "https://github.com/0x676e67/wreq-util", rev = "5715529002738f46eea86a7271f918f9374d3582", optional = true, features = ["emulation-compression"] }

[dev-dependencies]
socket2 = "0.6"
# TLS fixtures for the configured-roots tests: rcgen mints a throwaway CA + leaf,
# tokio-rustls serves one HTTPS response with them. Pinned to the ring
# provider so the test binary has a single rustls CryptoProvider (reqwest's
# rustls also uses ring; adding aws-lc-rs would make provider auto-selection
# panic).
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# `prefix-symbols` renames BoringSSL exports to avoid clashes with system OpenSSL,
# but the renaming is only correct on Linux and Android (per wreq's README).
# Enabling it on other platforms produces unresolved `build_script_main_*`
# symbols at link time (see issue #39).
#
# gzip/brotli/deflate/zstd enable wreq's response-body auto-decompression layer.
# These MUST be on whenever we advertise `accept-encoding` (via wreq-util's
# emulation-compression), otherwise a compressed 200 OK comes back as raw
# bytes the dump pipeline can't parse. Chrome 121+ advertises
# `gzip, deflate, br, zstd`; enabling all four keeps the wire advert and the
# decoder in lockstep.
# `socks` is required for stealth + SOCKS5 proxy support (upstream).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wreq = { version = "=0.16.1", optional = true, features = ["prefix-symbols", "socks", "stream", "gzip", "brotli", "deflate", "zstd"] }

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
wreq = { version = "=0.16.1", optional = true, features = ["socks", "stream", "gzip", "brotli", "deflate", "zstd"] }
